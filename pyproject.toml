[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcvr"
version = "0.1.0"
description = "Query-conditioned sparse warm-start prototype for CrossVid"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10",
  "PyYAML>=6",
]

[project.optional-dependencies]
models = ["torch>=2.4", "transformers>=4.57", "peft>=0.13"]
test = ["pytest>=8"]

[project.scripts]
toolcvr = "toolcvr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

